<style>
  :root { color-scheme: dark; }
  html, body { margin:0; padding:0; background:#050510; font-family:'Inter',system-ui,sans-serif; overflow-x:hidden; -webkit-tap-highlight-color:transparent; }
  #root { min-height:100dvh; }
  .glass { background:rgba(15,15,35,0.55); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); border:1px solid rgba(255,255,255,0.08); }
  .glass-strong { background:rgba(12,12,28,0.78); backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px); border:1px solid rgba(255,255,255,0.1); }
  .neon-border { box-shadow:0 0 0 1px rgba(34,211,238,0.22), 0 0 24px rgba(34,211,238,0.07); }
  .neon-text { text-shadow:0 0 14px rgba(34,211,238,0.45); }
  .particle { position:absolute; border-radius:50%; pointer-events:none; }
  .hydration-orb { position:relative; width:210px; height:210px; border-radius:50%; overflow:hidden; }
  .orb-ring { position:absolute; inset:0; border-radius:50%; border:2px solid rgba(34,211,238,0.28); box-shadow:0 0 28px rgba(34,211,238,0.18), inset 0 0 36px rgba(34,211,238,0.05); }
  .orb-water { position:absolute; bottom:0; left:0; right:0; background:linear-gradient(180deg,#22d3ee 0%,#3b82f6 45%,#6366f1 100%); transition:height 0.85s cubic-bezier(0.22,1,0.36,1); border-radius:50% 50% 0 0 / 18% 18% 0 0; }
  .orb-wave { position:absolute; top:-10px; left:-50%; width:200%; height:22px; background:radial-gradient(ellipse at center, rgba(255,255,255,0.32) 0%, transparent 70%); animation:wave 3.2s ease-in-out infinite; }
  @keyframes wave { 0%,100%{transform:translateX(0)} 50%{transform:translateX(22%)} }
  @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-7px)} }
  .robot-float { animation:float 5.2s ease-in-out infinite; }
  .safe-bottom { padding-bottom:calc(90px + env(safe-area-inset-bottom,0px)); }
  .hide-scroll::-webkit-scrollbar { display:none; }
  .hide-scroll { -ms-overflow-style:none; scrollbar-width:none; }
  input[type=time]::-webkit-calendar-picker-indicator { filter:invert(1); opacity:0.55; }
  .quote-glow { box-shadow:0 0 36px rgba(139,92,246,0.12); }
</style>
