<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no" />
<title>Smart Euclid — Stay Hydrated. Stay Curious.</title>
<meta name="description" content="Futuristic water-intake monitoring and personalized drinking reminder for students. Science + Philosophy + Humor." />
<meta name="theme-color" content="#050510" />
<link rel="manifest" href="manifest.json" />
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
<style>
:root{color-scheme:dark}
html,body{margin:0;padding:0;background:#050510;font-family:Inter,system-ui,sans-serif;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
#root{min-height:100dvh}
.glass{background:rgba(15,15,35,.55);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.08)}
.glass-strong{background:rgba(12,12,28,.8);backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.1)}
.neon-border{box-shadow:0 0 0 1px rgba(34,211,238,.22),0 0 24px rgba(34,211,238,.07)}
.neon-text{text-shadow:0 0 14px rgba(34,211,238,.45)}
.particle{position:absolute;border-radius:50%;pointer-events:none}
.hydration-orb{position:relative;width:200px;height:200px;border-radius:50%;overflow:hidden}
.orb-ring{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(34,211,238,.28);box-shadow:0 0 28px rgba(34,211,238,.18),inset 0 0 36px rgba(34,211,238,.05)}
.orb-water{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(180deg,#22d3ee 0%,#3b82f6 45%,#6366f1 100%);transition:height .85s cubic-bezier(.22,1,.36,1);border-radius:50% 50% 0 0/18% 18% 0 0}
.orb-wave{position:absolute;top:-10px;left:-50%;width:200%;height:22px;background:radial-gradient(ellipse at center,rgba(255,255,255,.32) 0%,transparent 70%);animation:wave 3.2s ease-in-out infinite}
@keyframes wave{0%,100%{transform:translateX(0)}50%{transform:translateX(22%)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.robot-float{animation:float 5.2s ease-in-out infinite}
.robot-shake{animation:shake .4s ease}
.robot-bounce{animation:bounce .5s ease}
.safe-bottom{padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}
input[type=time]::-webkit-calendar-picker-indicator{filter:invert(1);opacity:.55}
.quote-glow{box-shadow:0 0 36px rgba(139,92,246,.12)}
.font-display{font-family:Orbitron,system-ui,sans-serif}
.font-space{font-family:Space Grotesk,system-ui,sans-serif}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const {useState,useEffect,useMemo,useCallback,useRef}=React;

const storageGet=k=>{try{const v=localStorage.getItem(k);return v===null?undefined:JSON.parse(v)}catch{return undefined}};
const storageSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};

const pad2=n=>String(n).padStart(2,"0");
const todayStr=(d=new Date())=>`${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
const addDays=(ds,delta)=>{const [y,m,d]=ds.split("-").map(Number);const dt=new Date(y,m-1,d);dt.setDate(dt.getDate()+delta);return todayStr(dt)};
const to12h=hhmm=>{const [h,m]=hhmm.split(":").map(Number);const p=h>=12?"PM":"AM";let h12=h%12||12;return `${h12}:${pad2(m)} ${p}`};
const uid=()=>`${Date.now().toString(36)}${Math.random().toString(36).slice(2,7)}`;
const dayOfYear=(d=new Date())=>Math.floor((d-new Date(d.getFullYear(),0,0))/86400000);

function computeStreaks(entries,goal){
  const byDate={};entries.forEach(e=>{byDate[e.date]=(byDate[e.date]||0)+e.amount});
  const dates=Object.keys(byDate).sort();
  let longest=0,run=0,prev=null;
  dates.forEach(d=>{if(byDate[d]>=goal){run=prev&&addDays(prev,1)===d?run+1:1;longest=Math.max(longest,run);prev=d}else{run=0;prev=null}});
  let current=0,cursor=todayStr();
  if((byDate[cursor]||0)<goal)cursor=addDays(cursor,-1);
  while((byDate[cursor]||0)>=goal){current++;cursor=addDays(cursor,-1)}
  return{current,longest,byDate,anyDayReached:Object.values(byDate).some(v=>v>=goal)};
}

// Rough non-medical estimate: ~30–35 mL per kg body weight (common general guideline)
function suggestGoal(weightKg){
  const w=Number(weightKg);
  if(!w||w<30||w>250)return null;
  return Math.round((w*33)/50)*50; // round to nearest 50
}

const QUOTES=[
  {text:"Existence offers no instructions. At least drink some water.",author:"Smart Euclid",tag:"Original"},
  {text:"Meaning may be uncertain. Your hydration goal isn't.",author:"Smart Euclid",tag:"Original"},
  {text:"You are a temporary arrangement of matter with a hydration reminder.",author:"Smart Euclid",tag:"Original"},
  {text:"Perhaps life has no inherent meaning. The body still needs water.",author:"Smart Euclid",tag:"Original"},
  {text:"The universe is indifferent. Your cells are not.",author:"Smart Euclid",tag:"Original"},
  {text:"Another day of consciousness. Another glass of water.",author:"Smart Euclid",tag:"Original"},
  {text:"You cannot solve existence today. You can drink 250 mL.",author:"Smart Euclid",tag:"Original"},
  {text:"Even Sisyphus would need water.",author:"Smart Euclid",tag:"Original"},
  {text:"The void can wait. Hydration cannot.",author:"Smart Euclid",tag:"Original"},
  {text:"One must imagine Sisyphus happy — and hydrated.",author:"Smart Euclid",tag:"Original"},
];

const ROBOT_LINES={
  happy:["Excellent. Civilization survives another day.","Hydration achieved. The organism is momentarily content.","Well done. Even the absurd needs water."],
  worried:["You know water exists, right?","Your cells appear to be filing a formal complaint.","I am becoming concerned. Drink something."],
  excited:["Goal complete! Temporary victory over dehydration.","We did it. The routine continues tomorrow.","Hydration complete. I am mildly impressed."],
  proud:["A streak worth noting. Consistency is a form of rebellion.","You maintained the routine. Sisyphus would approve.","Steady progress. The machine is satisfied."],
  playful:["Touch detected. Hydration tax activated.","Is this your idea of hydration?","My face is not a button — but since you asked, drink water."],
  neutral:["The day continues. So should the water.","Existence remains unexplained. Hydration is optional but recommended.","Another ordinary day of being alive."],
  encouraging:["Small sips still count. Keep going.","Progress is progress. The organism notices.","You are closer than yesterday."],
  sleepy:["Even robots need downtime. You, however, still need water.","Quiet mode engaged. Drink, then rest."],
  log:["Another small victory for the organism.","Logged. Existence continues, slightly wetter.","Water received. Consciousness remains unexplained."],
  greet:["Welcome back. The void waited. So did your water goal.","Consciousness detected. Time for hydration.","Another day of being alive. Shall we hydrate?"],
  miss:["Several reminders went unanswered. I will pretend this was philosophical.","The water is still there. So am I."]
};

const TAP_LINES=[
  "Hey! If you touch my face again, you're drinking a glass of water.",
  "Why are you touching my face?",
  "Is this your idea of hydration?",
  "Touch detected. Hydration tax activated.",
  "My face is not a button.",
  "You have approximately three seconds to drink some water.",
  "Facial contact registered. Please hydrate.",
  "I am a robot companion, not a stress ball.",
  "That tickled. Now drink 250 mL.",
  "Existential crisis intensified by unnecessary face-touching."
];

const PERSONALITIES={
  philosophical:{label:"Philosophical"},
  cheerful:{label:"Cheerful"},
  sarcastic:{label:"Sarcastic"},
  calm:{label:"Calm"},
  scientific:{label:"Scientific"},
  chaotic:{label:"Chaotic"}
};

const ACHIEVEMENTS=[
  {id:"first_sip",title:"FIRST SIP",desc:"Log your first drink.",icon:"💧",check:c=>c.totalEntries>0},
  {id:"still_alive",title:"STILL ALIVE",desc:"Complete one daily goal.",icon:"✨",check:c=>c.anyDayReached},
  {id:"existentially",title:"EXISTENTIALLY HYDRATED",desc:"Maintain a 7-day streak.",icon:"🔮",check:c=>c.longest>=7},
  {id:"sisyphus",title:"SISYPHUS WOULD APPROVE",desc:"Maintain a 30-day streak.",icon:"🪨",check:c=>c.longest>=30},
];

const PRESET_AMOUNTS=[100,150,250,350,500];
const DEFAULT_SETTINGS={
  goal:2000,remindersEnabled:true,reminderStart:"07:00",reminderEnd:"21:00",reminderInterval:90,
  schoolMode:true,cameraEnabled:false,robotName:"Albert Camus",robotPersonality:"philosophical",
  sound:"default",customSoundName:null
};
const DEFAULT_PROFILE={name:"",age:"",gender:"",height:"",weight:"",wakeTime:"06:30",sleepTime:"22:00",photo:null};

function Logo({size=36}){
  return(<svg width={size} height={size} viewBox="0 0 64 64" fill="none">
    <defs><linearGradient id="lg" x1="8" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse">
      <stop stopColor="#22d3ee"/><stop offset="0.5" stopColor="#8b5cf6"/><stop offset="1" stopColor="#ec4899"/>
    </linearGradient></defs>
    <circle cx="32" cy="32" r="28" stroke="url(#lg)" strokeWidth="2" fill="rgba(10,10,30,0.6)"/>
    <path d="M32 10 C32 10 16 28 16 38 a16 16 0 0 0 32 0 C48 28 32 10 32 10 Z" fill="url(#lg)" opacity="0.9"/>
    <path d="M32 14 L32 50 M18 36 L46 36" stroke="white" strokeOpacity="0.35" strokeWidth="1.2"/>
    <circle cx="32" cy="28" r="3" fill="white" opacity="0.7"/>
  </svg>);
}

function Particles({count=12}){
  const parts=useMemo(()=>Array.from({length:count},(_,i)=>({id:i,x:Math.random()*100,y:Math.random()*100,s:1+Math.random()*2.6,d:4.5+Math.random()*7})),[count]);
  return(<div className="fixed inset-0 pointer-events-none overflow-hidden z-0">{parts.map(p=>(
    <div key={p.id} className="particle" style={{left:`${p.x}%`,top:`${p.y}%`,width:p.s,height:p.s,
      backgroundColor:p.id%3===0?'rgba(34,211,238,0.5)':p.id%3===1?'rgba(139,92,246,0.45)':'rgba(236,72,153,0.4)',
      animation:`float ${p.d}s ease-in-out infinite`,animationDelay:`${p.id*0.28}s`}}/>
  ))}</div>);
}

function HydrationOrb({percent,consumed,goal}){
  const fill=Math.min(100,percent);
  return(<div className="relative flex flex-col items-center">
    <div className="hydration-orb neon-border">
      <div className="orb-ring"/>
      <div className="absolute inset-3 rounded-full overflow-hidden bg-[#050510]/85">
        <div className="orb-water" style={{height:`${fill}%`}}><div className="orb-wave"/></div>
      </div>
      <div className="absolute inset-0 flex flex-col items-center justify-center z-10">
        <div className="font-display text-3xl font-bold text-white neon-text">{consumed}</div>
        <div className="text-xs text-cyan-300/80 mt-0.5">/ {goal} mL</div>
        <div className="mt-1 text-sm font-semibold text-cyan-400">{percent}%</div>
      </div>
    </div>
  </div>);
}

function RobotAvatar({size=80,mood="neutral",name,anim,onTap}){
  const eyes={happy:"◕",worried:"◉",excited:"★",proud:"●",playful:"✦",neutral:"●",encouraging:"○",sleepy:"–"}[mood]||"●";
  const mouth={happy:"‿",worried:"⌢",excited:"ᴗ",proud:"‿",playful:"ω",neutral:"—",encouraging:"‿",sleepy:"_"}[mood]||"—";
  const cls=anim==="shake"?"robot-shake":anim==="bounce"?"robot-bounce":"robot-float";
  return(
    <button type="button" onClick={onTap} className={`${cls} relative flex flex-col items-center active:scale-95 transition`} style={{width:size}}>
      <div className="relative rounded-2xl glass neon-border flex flex-col items-center justify-center" style={{width:size,height:size*0.92}}>
        <div className="absolute -top-2 w-8 h-2 rounded-full bg-cyan-500/40"/>
        <div className="flex gap-3 text-cyan-300 mt-1" style={{fontSize:size*0.16}}>{eyes} {eyes}</div>
        <div className="text-violet-300/80 mt-1" style={{fontSize:size*0.12}}>{mouth}</div>
        <div className="absolute bottom-2.5 w-6 h-1.5 rounded-full bg-violet-400/50"/>
      </div>
      <div className="mt-1.5 text-[10px] text-cyan-400/80 font-medium truncate max-w-[100px] text-center">{name}</div>
    </button>
  );
}

function Modal({open,onClose,title,children}){
  if(!open)return null;
  return(
    <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-black/70 backdrop-blur-sm" onClick={onClose}>
      <div className="w-full sm:max-w-sm rounded-t-3xl sm:rounded-3xl p-5 max-h-[88vh] overflow-y-auto glass-strong neon-border safe-bottom" onClick={e=>e.stopPropagation()}>
        <div className="flex items-center justify-between mb-4">
          <h3 className="font-display text-sm tracking-wider text-cyan-300">{title}</h3>
          <button onClick={onClose} className="w-8 h-8 rounded-full glass flex items-center justify-center text-slate-400">✕</button>
        </div>
        {children}
      </div>
    </div>
  );
}

function Toast({msg,onDone}){
  useEffect(()=>{const t=setTimeout(onDone,2400);return()=>clearTimeout(t)},[onDone]);
  return(<div className="fixed top-6 left-1/2 -translate-x-1/2 z-[60] px-4 py-2.5 rounded-2xl glass-strong neon-border text-sm text-cyan-100 max-w-[90%] text-center">{msg}</div>);
}

function CustomAmount({onSubmit}){
  const [v,setV]=useState("");const [err,setErr]=useState("");
  const go=()=>{const n=Number(v);if(!v||isNaN(n)||n<=0){setErr("Please enter a valid water amount.");return}if(n>5000){setErr("That amount seems unrealistic.");return}onSubmit(Math.round(n))};
  return(<div>
    <div className="flex gap-2">
      <input type="number" inputMode="numeric" value={v} onChange={e=>{setV(e.target.value);setErr("")}} placeholder="Custom mL" className="flex-1 rounded-xl px-3 py-3 bg-white/5 border border-white/10 outline-none text-sm"/>
      <button onClick={go} className="px-4 rounded-xl bg-cyan-500/30 border border-cyan-400/40 text-sm font-medium">Add</button>
    </div>
    {err&&<div className="text-xs text-red-400 mt-1.5">{err}</div>}
  </div>);
}

function Onboarding({onFinish}){
  const [step,setStep]=useState(0);
  const [name,setName]=useState("");
  const [age,setAge]=useState("");
  const [gender,setGender]=useState("");
  const [height,setHeight]=useState("");
  const [weight,setWeight]=useState("");
  const [goal,setGoal]=useState(2000);
  const [wake,setWake]=useState("06:30");
  const [sleep,setSleep]=useState("22:00");
  const [interval,setInterval_]=useState(90);
  const [camera,setCamera]=useState(false);
  const [robotName,setRobotName]=useState("Albert Camus");
  const [personality,setPersonality]=useState("philosophical");
  const steps=9;
  const next=()=>setStep(s=>Math.min(s+1,steps-1));
  const back=()=>setStep(s=>Math.max(s-1,0));
  const suggested=suggestGoal(weight);

  const finish=()=>{
    onFinish({
      profile:{name:name.trim()||"Explorer",age,gender,height,weight,wakeTime:wake,sleepTime:sleep,photo:null},
      settings:{...DEFAULT_SETTINGS,goal:Number(goal)||2000,reminderStart:wake,reminderEnd:sleep,reminderInterval:interval,cameraEnabled:camera,robotName:robotName.trim()||"Albert Camus",robotPersonality:personality}
    });
  };

  return(
    <div className="min-h-dvh relative overflow-hidden bg-[#050510] text-white">
      <Particles count={16}/>
      <div className="relative z-10 flex flex-col min-h-dvh max-w-md mx-auto px-6">
        <div className="flex justify-center gap-1 pt-10 pb-3">
          {Array.from({length:steps}).map((_,i)=>(
            <div key={i} className={`h-1 rounded-full transition-all ${i===step?'w-5 bg-cyan-400':i<step?'w-2 bg-violet-500':'w-1.5 bg-white/20'}`}/>
          ))}
        </div>
        <div className="flex-1 flex flex-col justify-center py-3 overflow-y-auto">
          {step===0&&(<div className="text-center space-y-4">
            <Logo size={68}/><h1 className="font-display text-2xl tracking-wide neon-text">SMART EUCLID</h1>
            <p className="text-cyan-300/90 text-sm font-medium">Stay Hydrated. Stay Curious.</p>
            <p className="text-slate-400 text-sm leading-relaxed">Your body is mostly water.<br/>Your existence remains unexplained.</p>
          </div>)}
          {step===1&&(<div className="space-y-3">
            <h2 className="font-display text-lg text-cyan-300">What should we call you?</h2>
            <input value={name} onChange={e=>setName(e.target.value)} placeholder="Your name" className="w-full rounded-2xl px-4 py-3.5 bg-white/5 border border-white/10 outline-none text-center text-lg"/>
          </div>)}
          {step===2&&(<div className="space-y-3">
            <h2 className="font-display text-lg text-cyan-300">A few optional details</h2>
            <p className="text-xs text-slate-400 leading-relaxed">This information is optional and is used only to personalize your hydration experience. Smart Euclid does not provide medical advice, diagnose conditions, or replace professional medical guidance.</p>
            <div className="grid grid-cols-2 gap-2">
              <div><div className="text-[10px] text-slate-500 mb-1">Age</div><input type="number" inputMode="numeric" value={age} onChange={e=>setAge(e.target.value)} placeholder="Optional" className="w-full rounded-xl px-3 py-2.5 bg-white/5 border border-white/10 outline-none text-sm"/></div>
              <div><div className="text-[10px] text-slate-500 mb-1">Gender</div>
                <select value={gender} onChange={e=>setGender(e.target.value)} className="w-full rounded-xl px-3 py-2.5 bg-white/5 border border-white/10 outline-none text-sm">
                  <option value="">Prefer not to say</option><option value="female">Female</option><option value="male">Male</option><option value="other">Other</option>
                </select>
              </div>
              <div><div className="text-[10px] text-slate-500 mb-1">Height (cm)</div><input type="number" inputMode="numeric" value={height} onChange={e=>setHeight(e.target.value)} placeholder="Optional" className="w-full rounded-xl px-3 py-2.5 bg-white/5 border border-white/10 outline-none text-sm"/></div>
              <div><div className="text-[10px] text-slate-500 mb-1">Weight (kg)</div><input type="number" inputMode="numeric" value={weight} onChange={e=>setWeight(e.target.value)} placeholder="Optional" className="w-full rounded-xl px-3 py-2.5 bg-white/5 border border-white/10 outline-none text-sm"/></div>
            </div>
          </div>)}
          {step===3&&(<div className="space-y-4 text-center">
            <h2 className="font-display text-lg text-cyan-300">Daily hydration goal</h2>
            <p className="text-xs text-slate-400">Personal target — not medical advice.</p>
            {suggested&&(<button onClick={()=>setGoal(suggested)} className="text-xs text-cyan-400 underline">Use estimate from weight: ~{suggested} mL</button>)}
            <div className="flex items-center justify-center gap-4">
              <button onClick={()=>setGoal(g=>Math.max(500,g-250))} className="w-12 h-12 rounded-full glass text-xl">−</button>
              <div className="font-display text-4xl w-36">{goal}<span className="text-sm text-slate-400 ml-1">mL</span></div>
              <button onClick={()=>setGoal(g=>g+250)} className="w-12 h-12 rounded-full glass text-xl">+</button>
            </div>
            <div className="flex flex-wrap justify-center gap-2">
              {[2000,2500,3000].map(g=>(<button key={g} onClick={()=>setGoal(g)} className={`px-3 py-1.5 rounded-full text-xs ${goal===g?'bg-cyan-500/30 text-cyan-300 border border-cyan-500/40':'glass'}`}>{g} mL</button>))}
            </div>
          </div>)}
          {step===4&&(<div className="space-y-3">
            <h2 className="font-display text-lg text-cyan-300">Wake-up & sleep</h2>
            <div className="grid grid-cols-2 gap-3">
              <div><div className="text-[10px] text-slate-500 mb-1">Wake</div><input type="time" value={wake} onChange={e=>setWake(e.target.value)} className="w-full rounded-2xl px-3 py-3 bg-white/5 border border-white/10 outline-none text-center"/></div>
              <div><div className="text-[10px] text-slate-500 mb-1">Sleep</div><input type="time" value={sleep} onChange={e=>setSleep(e.target.value)} className="w-full rounded-2xl px-3 py-3 bg-white/5 border border-white/10 outline-none text-center"/></div>
            </div>
            <p className="text-xs text-slate-400">No reminders during sleep hours.</p>
          </div>)}
          {step===5&&(<div className="space-y-3">
            <h2 className="font-display text-lg text-cyan-300">Reminder frequency</h2>
            {[60,90,120].map(m=>(
              <button key={m} onClick={()=>setInterval_(m)} className={`w-full py-3 rounded-2xl text-sm font-medium ${interval===m?'bg-cyan-500/25 border border-cyan-400/40 text-cyan-200':'glass'}`}>
                Every {m===60?'1 hour':m===90?'90 minutes':'2 hours'}
              </button>
            ))}
          </div>)}
          {step===6&&(<div className="space-y-4 text-center">
            <h2 className="font-display text-lg text-cyan-300">Camera Verification</h2>
            <p className="text-sm text-slate-400">Optional. Detects a drinking gesture, then you confirm the amount. Never claims exact volume.</p>
            <div className="flex gap-3">
              <button onClick={()=>{setCamera(true);next()}} className="flex-1 py-3 rounded-2xl bg-cyan-500/20 border border-cyan-400/40 text-cyan-200 font-medium">Enable</button>
              <button onClick={()=>{setCamera(false);next()}} className="flex-1 py-3 rounded-2xl glass">Not Now</button>
            </div>
          </div>)}
          {step===7&&(<div className="space-y-4 text-center">
            <h2 className="font-display text-lg text-cyan-300">Meet your companion</h2>
            <RobotAvatar size={96} name={robotName} mood="neutral"/>
            <p className="text-xs text-slate-400">Default nickname: <span className="text-violet-300">Albert Camus</span> — a playful absurdist reference (the robot, not the philosopher).</p>
            <input value={robotName} onChange={e=>setRobotName(e.target.value)} placeholder="Robot nickname" className="w-full rounded-2xl px-4 py-3 bg-white/5 border border-white/10 outline-none text-center"/>
            <div className="grid grid-cols-2 gap-2">
              {Object.entries(PERSONALITIES).map(([k,v])=>(
                <button key={k} onClick={()=>setPersonality(k)} className={`py-2 rounded-xl text-xs ${personality===k?'bg-violet-500/25 border border-violet-400/40 text-violet-200':'glass'}`}>{v.label}</button>
              ))}
            </div>
          </div>)}
          {step===8&&(<div className="text-center space-y-3">
            <div className="text-4xl">🔥</div>
            <h2 className="font-display text-lg text-cyan-300">Ready</h2>
            <p className="text-sm text-slate-400">You're all set, {name.trim()||"friend"}. Let's hydrate — and question existence later.</p>
          </div>)}
        </div>
        <div className="pb-10 pt-3 flex items-center gap-3">
          {step>0&&step!==6&&<button onClick={back} className="px-4 py-3 rounded-2xl glass text-sm">Back</button>}
          {step<8&&step!==6?(
            <button onClick={next} className="flex-1 py-3.5 rounded-2xl bg-gradient-to-r from-cyan-500 to-violet-600 text-white font-semibold text-sm">{step===0?"Begin":"Continue"}</button>
          ):step===8?(
            <button onClick={finish} className="flex-1 py-3.5 rounded-2xl bg-gradient-to-r from-cyan-500 to-violet-600 text-white font-semibold text-sm">Enter Smart Euclid</button>
          ):null}
        </div>
      </div>
    </div>
  );
}

function App(){
  const [loaded,setLoaded]=useState(false);
  const [profile,setProfile]=useState(DEFAULT_PROFILE);
  const [settings,setSettings]=useState(DEFAULT_SETTINGS);
  const [entries,setEntries]=useState([]);
  const [showOnboarding,setShowOnboarding]=useState(false);
  const [tab,setTab]=useState("home");
  const [toast,setToast]=useState(null);
  const [showLog,setShowLog]=useState(false);
  const [showCamera,setShowCamera]=useState(false);
  const [camState,setCamState]=useState("idle");
  const [camResult,setCamResult]=useState(null);
  const [robotMsg,setRobotMsg]=useState("");
  const [robotMood,setRobotMood]=useState("neutral");
  const [robotAnim,setRobotAnim]=useState(null);
  const [quoteIdx,setQuoteIdx]=useState(0);
  const [reminderStats,setReminderStats]=useState({completed:0,missed:0});
  const audioRef=useRef(null);
  const customAudioRef=useRef(null);

  useEffect(()=>{
    const p=storageGet("se_profile");
    const s=storageGet("se_settings");
    const e=storageGet("se_entries");
    const r=storageGet("se_reminder_stats");
    setProfile(p?{...DEFAULT_PROFILE,...p}:DEFAULT_PROFILE);
    setSettings({...DEFAULT_SETTINGS,...(s||{})});
    setEntries(Array.isArray(e)?e:[]);
    setReminderStats(r||{completed:0,missed:0});
    setShowOnboarding(!p||!p.name);
    setQuoteIdx(dayOfYear()%QUOTES.length);
    setLoaded(true);
  },[]);

  useEffect(()=>{if(loaded){const t=setTimeout(()=>storageSet("se_profile",profile),250);return()=>clearTimeout(t)}},[profile,loaded]);
  useEffect(()=>{if(loaded){const t=setTimeout(()=>storageSet("se_settings",settings),250);return()=>clearTimeout(t)}},[settings,loaded]);
  useEffect(()=>{if(loaded){const t=setTimeout(()=>storageSet("se_entries",entries),250);return()=>clearTimeout(t)}},[entries,loaded]);
  useEffect(()=>{if(loaded){const t=setTimeout(()=>storageSet("se_reminder_stats",reminderStats),250);return()=>clearTimeout(t)}},[reminderStats,loaded]);

  const todayKey=todayStr();
  const todays=useMemo(()=>entries.filter(e=>e.date===todayKey).sort((a,b)=>a.time.localeCompare(b.time)),[entries,todayKey]);
  const consumed=useMemo(()=>todays.reduce((s,e)=>s+e.amount,0),[todays]);
  const goal=settings.goal||2000;
  const remaining=Math.max(goal-consumed,0);
  const percent=goal>0?Math.min(100,Math.round((consumed/goal)*100)):0;
  const streaks=useMemo(()=>computeStreaks(entries,goal),[entries,goal]);
  const achievementCtx={totalEntries:entries.length,anyDayReached:streaks.anyDayReached,longest:streaks.longest};

  const pickLine=useCallback((type)=>{
    const arr=ROBOT_LINES[type]||ROBOT_LINES.neutral;
    return arr[Math.floor(Math.random()*arr.length)];
  },[]);

  // Update Albert's mood based on progress
  useEffect(()=>{
    if(!loaded||showOnboarding)return;
    if(percent>=100){setRobotMood("excited");setRobotMsg(pickLine("excited"));}
    else if(percent>=75){setRobotMood("proud");setRobotMsg(pickLine("proud"));}
    else if(percent<25&&todays.length===0){setRobotMood("worried");setRobotMsg(pickLine("worried"));}
    else if(percent>=50){setRobotMood("happy");setRobotMsg(pickLine("happy"));}
    else{setRobotMood("encouraging");setRobotMsg(pickLine("encouraging"));}
  },[loaded,showOnboarding,percent,todays.length,pickLine]);

  const addEntry=amount=>{
    const n=Math.round(Number(amount));
    if(!n||n<=0||n>5000)return;
    const now=new Date();
    const entry={id:uid(),date:todayStr(),time:`${pad2(now.getHours())}:${pad2(now.getMinutes())}`,amount:n};
    setEntries(prev=>[...prev,entry]);
    setToast(`+${n} mL · ${pickLine("log")}`);
    setRobotMood("happy");
    setRobotMsg(pickLine("log"));
    setRobotAnim("bounce");
    setTimeout(()=>setRobotAnim(null),600);
  };

  const deleteEntry=id=>setEntries(prev=>prev.filter(e=>e.id!==id));

  const finishOnboarding=({profile:p,settings:s})=>{
    setProfile(p);
    setSettings(prev=>({...prev,...s}));
    setShowOnboarding(false);
    setRobotMood("happy");
    setRobotMsg(pickLine("greet"));
  };

  const onRobotTap=()=>{
    const line=TAP_LINES[Math.floor(Math.random()*TAP_LINES.length)];
    setRobotMsg(line);
    setRobotMood("playful");
    setRobotAnim("shake");
    setTimeout(()=>setRobotAnim(null),500);
  };

  const startCamera=()=>{
    if(!settings.cameraEnabled){setToast("Camera verification is off. Enable it in Profile.");setShowLog(true);return;}
    setShowCamera(true);setCamState("preparing");
    setTimeout(()=>{setCamState("detecting");setTimeout(()=>{setCamResult(Math.random()>0.25);setCamState("result");},1600);},900);
  };

  const playDefaultSound=()=>{
    // Simple Web Audio beep as default "ringtone"
    try{
      const ctx=new (window.AudioContext||window.webkitAudioContext)();
      const o=ctx.createOscillator();const g=ctx.createGain();
      o.connect(g);g.connect(ctx.destination);
      o.frequency.value=680;o.type="sine";
      g.gain.setValueAtTime(0.15,ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.01,ctx.currentTime+0.4);
      o.start();o.stop(ctx.currentTime+0.4);
    }catch(e){}
  };

  const previewSound=()=>{
    if(settings.sound==="custom"&&customAudioRef.current){
      customAudioRef.current.currentTime=0;
      customAudioRef.current.play().catch(()=>playDefaultSound());
    }else playDefaultSound();
  };

  const onCustomSound=e=>{
    const file=e.target.files&&e.target.files[0];
    if(!file)return;
    if(!file.type.startsWith("audio/")){setToast("Please choose an audio file.");return;}
    const url=URL.createObjectURL(file);
    if(customAudioRef.current){customAudioRef.current.src=url;}
    else{customAudioRef.current=new Audio(url);}
    setSettings(s=>({...s,sound:"custom",customSoundName:file.name}));
    setToast("Custom sound saved for this session.");
  };

  const weeklyData=useMemo(()=>{
    const days=[];
    for(let i=6;i>=0;i--){
      const ds=addDays(todayKey,-i);
      const total=entries.filter(e=>e.date===ds).reduce((s,e)=>s+e.amount,0);
      days.push({day:new Date(ds+"T12:00:00").toLocaleDateString(undefined,{weekday:"short"}),amount:total});
    }
    return days;
  },[entries,todayKey]);

  const highestDay=useMemo(()=>{
    const by={};entries.forEach(e=>{by[e.date]=(by[e.date]||0)+e.amount});
    const vals=Object.values(by);
    return vals.length?Math.max(...vals):0;
  },[entries]);

  const greeting=()=>{
    const h=new Date().getHours();
    if(h<12)return "Good morning";
    if(h<17)return "Good afternoon";
    return "Good evening";
  };

  if(!loaded)return <div className="min-h-dvh bg-[#050510] flex items-center justify-center"><Logo size={48}/></div>;
  if(showOnboarding)return <Onboarding onFinish={finishOnboarding}/>;

  const quote=QUOTES[quoteIdx%QUOTES.length];

  return(
    <div className="min-h-dvh bg-[#050510] text-white relative overflow-x-hidden">
      <Particles count={11}/>
      {toast&&<Toast msg={toast} onDone={()=>setToast(null)}/>}

      <header className="relative z-10 max-w-md mx-auto px-5 pt-5 pb-2 flex items-center justify-between">
        <div className="flex items-center gap-3">
          <Logo size={34}/>
          <div>
            <div className="font-display text-sm tracking-widest text-cyan-300">SMART EUCLID</div>
            <div className="text-[10px] text-slate-500">Stay Hydrated. Stay Curious.</div>
          </div>
        </div>
        {streaks.current>0&&(
          <div className="px-2.5 py-1 rounded-full glass text-xs text-amber-300 flex items-center gap-1">
            <span>🔥</span> {streaks.current}d
          </div>
        )}
      </header>

      <main className="relative z-10 max-w-md mx-auto px-5 safe-bottom">
        {/* HOME */}
        {tab==="home"&&(
          <div className="space-y-4 pt-2">
            <div className="flex items-center justify-between">
              <div>
                <div className="text-xs text-slate-400">{greeting()},</div>
                <div className="font-space text-lg font-semibold">{profile.name||"Explorer"}</div>
              </div>
              <RobotAvatar size={58} mood={robotMood} name={settings.robotName} anim={robotAnim} onTap={onRobotTap}/>
            </div>

            <div className="glass rounded-3xl p-5 neon-border flex flex-col items-center">
              <HydrationOrb percent={percent} consumed={consumed} goal={goal}/>
              <div className="grid grid-cols-3 gap-2 w-full mt-5">
                <div className="rounded-2xl bg-white/5 py-2 text-center">
                  <div className="text-sm font-semibold text-cyan-300">{remaining}</div>
                  <div className="text-[10px] text-slate-500">Remaining</div>
                </div>
                <div className="rounded-2xl bg-white/5 py-2 text-center">
                  <div className="text-sm font-semibold text-violet-300">{todays.length}</div>
                  <div className="text-[10px] text-slate-500">Drinks</div>
                </div>
                <div className="rounded-2xl bg-white/5 py-2 text-center">
                  <div className="text-sm font-semibold text-pink-300">{streaks.current}d</div>
                  <div className="text-[10px] text-slate-500">Streak</div>
                </div>
              </div>
            </div>

            <div className="glass rounded-2xl p-3.5 flex gap-3 items-start">
              <div className="w-9 h-9 rounded-xl bg-violet-500/20 flex items-center justify-center text-sm shrink-0">🤖</div>
              <div className="text-sm text-slate-200 leading-snug pt-0.5">{robotMsg||pickLine("greet")}</div>
            </div>

            <button onClick={()=>setShowLog(true)} className="w-full py-4 rounded-2xl bg-gradient-to-r from-cyan-500 to-violet-600 text-white font-semibold text-sm shadow-lg shadow-cyan-500/20 flex items-center justify-center gap-2">
              + Add Water
            </button>
            <div className="grid grid-cols-2 gap-3">
              <button onClick={startCamera} className="py-3 rounded-2xl glass border border-white/10 text-sm font-medium">📷 Verify</button>
              <button onClick={()=>setTab("robot")} className="py-3 rounded-2xl glass border border-white/10 text-sm font-medium">Talk to Albert</button>
            </div>

            <div className="glass rounded-3xl p-4 quote-glow border border-violet-500/20">
              <div className="text-[10px] tracking-widest text-violet-400 mb-2">THOUGHT OF THE DAY</div>
              <p className="text-sm text-slate-100 leading-relaxed italic">"{quote.text}"</p>
              <div className="mt-2 flex items-center justify-between text-[11px]">
                <span className="text-slate-400">— {quote.author}</span>
                <span className="px-2 py-0.5 rounded-full bg-violet-500/20 text-violet-300">{quote.tag}</span>
              </div>
            </div>

            <div className="glass rounded-2xl p-4">
              <div className="flex justify-between items-center mb-2">
                <div className="text-xs tracking-wider text-slate-400">TODAY</div>
                <button onClick={()=>setTab("stats")} className="text-[11px] text-cyan-400">Full history →</button>
              </div>
              {todays.length===0?(<div className="text-sm text-slate-500 py-3 text-center">No entries yet. Log your first sip.</div>):(
                <div className="space-y-2">{todays.slice(-4).reverse().map(e=>(
                  <div key={e.id} className="flex justify-between text-sm">
                    <span className="text-slate-400">{to12h(e.time)}</span>
                    <span className="text-cyan-300 font-medium">{e.amount} mL</span>
                  </div>
                ))}</div>
              )}
            </div>
          </div>
        )}

        {/* STATS */}
        {tab==="stats"&&(
          <div className="space-y-4 pt-2">
            <h2 className="font-display text-sm tracking-wider text-cyan-300">STATISTICS</h2>
            <div className="glass rounded-3xl p-4">
              <div className="text-xs text-slate-400 mb-3">Last 7 days</div>
              <div className="flex items-end gap-2 h-28">
                {weeklyData.map((d,i)=>{
                  const max=Math.max(...weeklyData.map(x=>x.amount),1);
                  const h=Math.max(6,(d.amount/max)*100);
                  return(<div key={i} className="flex-1 flex flex-col items-center gap-1">
                    <div className="w-full rounded-t-lg bg-gradient-to-t from-cyan-600 to-violet-500" style={{height:`${h}%`}}/>
                    <div className="text-[9px] text-slate-500">{d.day}</div>
                  </div>);
                })}
              </div>
            </div>
            <div className="grid grid-cols-2 gap-3">
              {[
                {l:"Avg daily",v:`${Math.round(weeklyData.reduce((s,d)=>s+d.amount,0)/7)} mL`},
                {l:"Current streak",v:`${streaks.current} days`},
                {l:"Longest streak",v:`${streaks.longest} days`},
                {l:"Highest day",v:`${highestDay} mL`},
                {l:"Total logged",v:`${entries.reduce((s,e)=>s+e.amount,0)} mL`},
                {l:"Reminders done",v:`${reminderStats.completed}`},
              ].map((s,i)=>(
                <div key={i} className="glass rounded-2xl p-3 text-center">
                  <div className="text-lg font-semibold text-cyan-300">{s.v}</div>
                  <div className="text-[10px] text-slate-500">{s.l}</div>
                </div>
              ))}
            </div>
            <div className="glass rounded-3xl p-4">
              <div className="text-xs tracking-wider text-slate-400 mb-3">ACHIEVEMENTS</div>
              <div className="space-y-2">
                {ACHIEVEMENTS.map(a=>{
                  const unlocked=a.check(achievementCtx);
                  return(<div key={a.id} className={`flex items-center gap-3 rounded-2xl px-3 py-2.5 ${unlocked?'bg-white/5 border border-cyan-500/20':'opacity-40'}`}>
                    <span className="text-xl">{a.icon}</span>
                    <div><div className="text-xs font-semibold tracking-wide">{a.title}</div><div className="text-[10px] text-slate-500">{a.desc}</div></div>
                  </div>);
                })}
              </div>
            </div>
            <div className="glass rounded-3xl p-4">
              <div className="text-xs tracking-wider text-slate-400 mb-3">DRINKING HISTORY</div>
              {todays.length===0&&<div className="text-sm text-slate-500 text-center py-4">Nothing today yet.</div>}
              {todays.map(e=>(
                <div key={e.id} className="flex items-center justify-between py-2.5 border-b border-white/5 last:border-0">
                  <div className="text-sm text-slate-300">{to12h(e.time)}</div>
                  <div className="flex items-center gap-3">
                    <span className="text-sm font-medium text-cyan-300">{e.amount} mL</span>
                    <button onClick={()=>deleteEntry(e.id)} className="text-xs text-red-400/80">✕</button>
                  </div>
                </div>
              ))}
            </div>
          </div>
        )}

        {/* DRINK */}
        {tab==="drink"&&(
          <div className="space-y-4 pt-2">
            <h2 className="font-display text-sm tracking-wider text-cyan-300">LOG WATER</h2>
            <p className="text-xs text-slate-400">Manual entry is the reliable core. Camera is optional verification only.</p>
            <div className="grid grid-cols-3 gap-3">
              {PRESET_AMOUNTS.map(a=>(
                <button key={a} onClick={()=>{addEntry(a);setTab("home")}} className="py-5 rounded-2xl glass border border-white/10 font-semibold text-cyan-200">
                  {a}<span className="text-[10px] text-slate-500 block mt-0.5">mL</span>
                </button>
              ))}
              <button onClick={()=>setShowLog(true)} className="py-5 rounded-2xl bg-gradient-to-br from-violet-600/30 to-pink-600/20 border border-violet-400/30 font-semibold text-sm">Custom</button>
            </div>
            <button onClick={startCamera} className="w-full py-4 rounded-2xl glass border border-cyan-500/20 flex items-center justify-center gap-2 text-sm">📷 Verify with Camera</button>
            <div className="glass rounded-2xl p-4 text-xs text-slate-400 leading-relaxed">
              The camera never assigns a precise volume. After detection you always confirm the amount yourself.
            </div>
          </div>
        )}

        {/* ROBOT */}
        {tab==="robot"&&(
          <div className="space-y-4 pt-2">
            <h2 className="font-display text-sm tracking-wider text-cyan-300">THE SMART EUCLID ROBOT</h2>
            <div className="glass rounded-3xl p-6 flex flex-col items-center neon-border">
              <RobotAvatar size={120} mood={robotMood} name={settings.robotName} anim={robotAnim} onTap={onRobotTap}/>
              <p className="mt-4 text-sm text-center text-slate-200 leading-relaxed max-w-[260px]">{robotMsg}</p>
              <div className="flex flex-wrap justify-center gap-2 mt-5">
                <button onClick={()=>{setRobotMood("encouraging");setRobotMsg(pickLine("encouraging"))}} className="px-3 py-2 rounded-xl glass text-xs">Encourage</button>
                <button onClick={()=>{setQuoteIdx(i=>(i+1)%QUOTES.length);setRobotMsg(QUOTES[(quoteIdx+1)%QUOTES.length].text);setRobotMood("philosophical" in PERSONALITIES?"neutral":"neutral")}} className="px-3 py-2 rounded-xl glass text-xs">Quote</button>
                <button onClick={()=>{setRobotMood("proud");setRobotMsg(`Current streak: ${streaks.current} days. Longest: ${streaks.longest}.`)} className="px-3 py-2 rounded-xl glass text-xs">Streak</button>
                <button onClick={onRobotTap} className="px-3 py-2 rounded-xl glass text-xs">Tap me</button>
              </div>
            </div>
            <div className="glass rounded-2xl p-4">
              <div className="text-xs text-slate-400 mb-2">Personality · {PERSONALITIES[settings.robotPersonality]?.label}</div>
              <div className="grid grid-cols-3 gap-2">
                {Object.entries(PERSONALITIES).map(([k,v])=>(
                  <button key={k} onClick={()=>setSettings(s=>({...s,robotPersonality:k}))} className={`py-2 rounded-xl text-[10px] ${settings.robotPersonality===k?'bg-violet-500/30 border border-violet-400/40':'glass'}`}>{v.label}</button>
                ))}
              </div>
            </div>
            <div className="glass rounded-2xl p-4">
              <div className="text-xs text-slate-400 mb-2">Rename companion</div>
              <input value={settings.robotName} onChange={e=>setSettings(s=>({...s,robotName:e.target.value}))} className="w-full rounded-xl px-3 py-2.5 bg-white/5 border border-white/10 outline-none text-sm"/>
            </div>
            <div className="glass rounded-2xl p-4 quote-glow">
              <div className="text-[10px] tracking-widest text-violet-400 mb-2">QUOTE LIBRARY</div>
              <p className="text-sm italic text-slate-200">"{quote.text}"</p>
              <div className="mt-2 text-[11px] text-slate-500">{quote.author} · {quote.tag}</div>
              <button onClick={()=>setQuoteIdx(i=>(i+1)%QUOTES.length)} className="mt-3 text-xs text-cyan-400">Next thought →</button>
            </div>
          </div>
        )}

        {/* PROFILE */}
        {tab==="profile"&&(
          <div className="space-y-4 pt-2 pb-4">
            <h2 className="font-display text-sm tracking-wider text-cyan-300">PROFILE</h2>

            <div className="glass rounded-3xl p-4 space-y-3">
              <div className="text-xs tracking-wider text-slate-400">IDENTITY</div>
              <div>
                <div className="text-[10px] text-slate-500 mb-1">Name</div>
                <input value={profile.name||""} onChange={e=>setProfile(p=>({...p,name:e.target.value}))} className="w-full rounded-xl px-3 py-2.5 bg-white/5 border border-white/10 outline-none text-sm"/>
              </div>
              <div className="grid grid-cols-2 gap-2">
                <div>
                  <div className="text-[10px] text-slate-500 mb-1">Age</div>
                  <input type="number" inputMode="numeric" value={profile.age||""} onChange={e=>setProfile(p=>({...p,age:e.target.value}))} className="w-full rounded-xl px-3 py-2.5 bg-white/5 border border-white/10 outline-none text-sm"/>
                </div>
                <div>
                  <div className="text-[10px] text-slate-500 mb-1">Gender</div>
                  <select value={profile.gender||""} onChange={e=>setProfile(p=>({...p,gender:e.target.value}))} className="w-full rounded-xl px-3 py-2.5 bg-white/5 border border-white/10 outline-none text-sm">
                    <option value="">Prefer not to say</option>
                    <option value="female">Female</option>
                    <option value="male">Male</option>
                    <option value="other">Other</option>
                  </select>
                </div>
                <div>
                  <div className="text-[10px] text-slate-500 mb-1">Height (cm)</div>
                  <input type="number" inputMode="numeric" value={profile.height||""} onChange={e=>setProfile(p=>({...p,height:e.target.value}))} className="w-full rounded-xl px-3 py-2.5 bg-white/5 border border-white/10 outline-none text-sm"/>
                </div>
                <div>
                  <div className="text-[10px] text-slate-500 mb-1">Weight (kg)</div>
                  <input type="number" inputMode="numeric" value={profile.weight||""} onChange={e=>setProfile(p=>({...p,weight:e.target.value}))} className="w-full rounded-xl px-3 py-2.5 bg-white/5 border border-white/10 outline-none text-sm"/>
                </div>
              </div>
              {suggestGoal(profile.weight)&&(
                <button onClick={()=>setSettings(s=>({...s,goal:suggestGoal(profile.weight)}))} className="text-xs text-cyan-400">
                  Suggest goal from weight (~{suggestGoal(profile.weight)} mL)
                </button>
              )}
            </div>

            <div className="glass rounded-3xl p-4 space-y-3">
              <div className="text-xs tracking-wider text-slate-400">HYDRATION GOAL</div>
              <div className="flex items-center gap-3">
                <button onClick={()=>setSettings(s=>({...s,goal:Math.max(500,s.goal-250)}))} className="w-10 h-10 rounded-full glass">−</button>
                <div className="flex-1 text-center font-display text-xl">{settings.goal} mL</div>
                <button onClick={()=>setSettings(s=>({...s,goal:s.goal+250}))} className="w-10 h-10 rounded-full glass">+</button>
              </div>
              <p className="text-[10px] text-slate-500">You can always override the suggested amount. This is a personal target, not medical advice.</p>
            </div>

            <div className="glass rounded-3xl p-4 space-y-3">
              <div className="text-xs tracking-wider text-slate-400">REMINDERS</div>
              <div className="flex justify-between items-center">
                <span className="text-sm">Enabled</span>
                <button onClick={()=>setSettings(s=>({...s,remindersEnabled:!s.remindersEnabled}))} className={`w-11 h-6 rounded-full relative ${settings.remindersEnabled?'bg-cyan-500':'bg-slate-700'}`}>
                  <span className={`absolute top-0.5 w-5 h-5 rounded-full bg-white transition-all ${settings.remindersEnabled?'left-5':'left-0.5'}`}/>
                </button>
              </div>
              <div className="grid grid-cols-2 gap-2">
                <div><div className="text-[10px] text-slate-500 mb-1">Start</div><input type="time" value={settings.reminderStart} onChange={e=>setSettings(s=>({...s,reminderStart:e.target.value}))} className="w-full rounded-xl px-2 py-2 bg-white/5 border border-white/10 text-sm"/></div>
                <div><div className="text-[10px] text-slate-500 mb-1">End</div><input type="time" value={settings.reminderEnd} onChange={e=>setSettings(s=>({...s,reminderEnd:e.target.value}))} className="w-full rounded-xl px-2 py-2 bg-white/5 border border-white/10 text-sm"/></div>
              </div>
              <div>
                <div className="text-[10px] text-slate-500 mb-1">Interval</div>
                <select value={settings.reminderInterval} onChange={e=>setSettings(s=>({...s,reminderInterval:Number(e.target.value)}))} className="w-full rounded-xl px-3 py-2.5 bg-white/5 border border-white/10 text-sm outline-none">
                  <option value={60}>Every 1 hour</option>
                  <option value={90}>Every 90 minutes</option>
                  <option value={120}>Every 2 hours</option>
                </select>
              </div>
            </div>

            <div className="glass rounded-3xl p-4 space-y-3">
              <div className="text-xs tracking-wider text-slate-400">REMINDER SOUND</div>
              <div className="flex gap-2">
                <button onClick={()=>setSettings(s=>({...s,sound:"default"}))} className={`flex-1 py-2.5 rounded-xl text-xs ${settings.sound==="default"?'bg-cyan-500/25 border border-cyan-400/40':'glass'}`}>Default Smart Euclid</button>
                <button onClick={()=>setSettings(s=>({...s,sound:"custom"}))} className={`flex-1 py-2.5 rounded-xl text-xs ${settings.sound==="custom"?'bg-cyan-500/25 border border-cyan-400/40':'glass'}`}>Custom</button>
              </div>
              <div className="flex gap-2 items-center">
                <label className="flex-1 py-2.5 rounded-xl glass text-xs text-center cursor-pointer">
                  Upload audio
                  <input type="file" accept="audio/*" className="hidden" onChange={onCustomSound}/>
                </label>
                <button onClick={previewSound} className="px-4 py-2.5 rounded-xl bg-violet-500/20 border border-violet-400/30 text-xs">Preview</button>
              </div>
              {settings.customSoundName&&<div className="text-[10px] text-slate-500">Current: {settings.customSoundName}</div>}
              <p className="text-[10px] text-slate-500 leading-relaxed">Web browsers limit background notification sounds. The selected sound plays when you preview or when a reminder fires while the app is open.</p>
            </div>

            <div className="glass rounded-3xl p-4 space-y-3">
              <div className="text-xs tracking-wider text-slate-400">CAMERA</div>
              <div className="flex justify-between items-center">
                <div>
                  <div className="text-sm">Camera Verification</div>
                  <div className="text-[10px] text-slate-500">Optional · never auto-measures mL</div>
                </div>
                <button onClick={()=>setSettings(s=>({...s,cameraEnabled:!s.cameraEnabled}))} className={`w-11 h-6 rounded-full relative ${settings.cameraEnabled?'bg-cyan-500':'bg-slate-700'}`}>
                  <span className={`absolute top-0.5 w-5 h-5 rounded-full bg-white transition-all ${settings.cameraEnabled?'left-5':'left-0.5'}`}/>
                </button>
              </div>
            </div>

            <div className="glass rounded-3xl p-4 space-y-2 text-xs text-slate-400 leading-relaxed">
              <div className="text-slate-300 font-medium">Privacy & Disclaimer</div>
              <p>Smart Euclid is a hydration tracking and reminder application. It is not a medical device and does not provide medical diagnosis or treatment. Hydration needs vary between individuals. Consult a qualified healthcare professional for medical concerns.</p>
              <p>Age, height, weight and gender are optional and used only to personalize your experience inside this app. All data stays on this device (localStorage). No data is sent to a server.</p>
              <p className="text-[10px] pt-1">Research project · Liceo de Sto. Tomas de Aquinas · Grade 12 STEM</p>
            </div>

            <button onClick={()=>{
              if(confirm("Reset all local data and restart onboarding?")){
                setEntries([]);setProfile(DEFAULT_PROFILE);setSettings(DEFAULT_SETTINGS);setReminderStats({completed:0,missed:0});
                storageSet("se_profile",null);storageSet("se_settings",DEFAULT_SETTINGS);storageSet("se_entries",[]);storageSet("se_reminder_stats",{completed:0,missed:0});
                setShowOnboarding(true);
              }
            }} className="w-full py-3 rounded-2xl text-sm text-red-400/90 border border-red-500/20">Reset all data</button>
          </div>
        )}
      </main>

      {/* BOTTOM NAV */}
      <nav className="fixed bottom-0 left-0 right-0 z-40 glass-strong border-t border-white/5" style={{paddingBottom:"env(safe-area-inset-bottom,0px)"}}>
        <div className="max-w-md mx-auto grid grid-cols-5">
          {[
            {id:"home",label:"Home",icon:"⌂"},
            {id:"stats",label:"Stats",icon:"▤"},
            {id:"drink",label:"Drink",icon:"💧",accent:true},
            {id:"robot",label:"Robot",icon:"🤖"},
            {id:"profile",label:"Profile",icon:"◎"},
          ].map(t=>(
            <button key={t.id} onClick={()=>setTab(t.id)} className={`flex flex-col items-center gap-0.5 py-2.5 text-[10px] ${tab===t.id?'text-cyan-300':'text-slate-500'} ${t.accent?'relative':''}`}>
              {t.accent?(
                <div className={`w-11 h-11 -mt-5 rounded-full flex items-center justify-center text-lg shadow-lg ${tab===t.id?'bg-gradient-to-br from-cyan-400 to-violet-600':'bg-gradient-to-br from-cyan-600/80 to-violet-700/80'}`}>💧</div>
              ):(<span className="text-lg leading-none">{t.icon}</span>)}
              <span className={t.accent?'mt-0.5':''}>{t.label}</span>
            </button>
          ))}
        </div>
      </nav>

      <Modal open={showLog} onClose={()=>setShowLog(false)} title="LOG WATER">
        <div className="grid grid-cols-3 gap-2 mb-4">
          {PRESET_AMOUNTS.map(a=>(
            <button key={a} onClick={()=>{addEntry(a);setShowLog(false)}} className="py-4 rounded-2xl glass text-sm font-semibold text-cyan-200">{a} mL</button>
          ))}
        </div>
        <CustomAmount onSubmit={n=>{addEntry(n);setShowLog(false)}}/>
      </Modal>

      <Modal open={showCamera} onClose={()=>{setShowCamera(false);setCamState("idle")}} title="CAMERA VERIFICATION">
        {camState==="preparing"&&(<div className="text-center py-8 space-y-3"><div className="text-4xl animate-pulse">📷</div><div className="text-sm text-slate-300">Preparing camera…</div><div className="text-xs text-slate-500">On-device only · no recording</div></div>)}
        {camState==="detecting"&&(<div className="text-center py-8 space-y-3"><div className="w-40 h-40 mx-auto rounded-2xl bg-gradient-to-br from-cyan-900/40 to-violet-900/40 border border-cyan-500/30 flex items-center justify-center"><div className="text-sm text-cyan-300 animate-pulse">Detecting…</div></div><div className="text-xs text-slate-500">Look for a drinking gesture</div></div>)}
        {camState==="result"&&(
          <div className="text-center py-4 space-y-4">
            <div className={`text-lg font-semibold ${camResult?'text-cyan-300':'text-amber-300'}`}>{camResult?"Drinking detected":"No drinking detected"}</div>
            <p className="text-xs text-slate-400">Camera does not measure milliliters. Confirm the amount you drank.</p>
            {camResult?(
              <>
                <div className="grid grid-cols-3 gap-2">{PRESET_AMOUNTS.map(a=>(
                  <button key={a} onClick={()=>{addEntry(a);setShowCamera(false);setCamState("idle")}} className="py-3 rounded-xl glass text-xs font-medium">{a}</button>
                ))}</div>
                <CustomAmount onSubmit={n=>{addEntry(n);setShowCamera(false);setCamState("idle")}}/>
              </>
            ):(
              <div className="flex gap-2">
                <button onClick={()=>{setCamState("preparing");setTimeout(()=>{setCamState("detecting");setTimeout(()=>{setCamResult(Math.random()>0.3);setCamState("result")},1600)},800)}} className="flex-1 py-3 rounded-2xl glass text-sm">Try Again</button>
                <button onClick={()=>{setShowCamera(false);setShowLog(true);setCamState("idle")}} className="flex-1 py-3 rounded-2xl bg-cyan-500/20 border border-cyan-400/30 text-sm">Log Manually</button>
              </div>
            )}
          </div>
        )}
      </Modal>
    </div>
  );
}

const root=ReactDOM.createRoot(document.getElementById("root"));
root.render(<App/>);
</script>
</body>
</html>
