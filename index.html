/* ---------------------------------- storage (localStorage) ---------------------------------- */

const storageGet = (key) => {
  try {
    const v = localStorage.getItem(key);
    return v === null ? undefined : JSON.parse(v);
  } catch (e) { return undefined; }
};
const storageSet = (key, value) => {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
};

/* ---------------------------------- helpers ---------------------------------- */

const pad2 = (n) => String(n).padStart(2, "0");

const todayStr = (d = new Date()) =>
  `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;

const addDays = (dateStr, delta) => {
  const [y, m, d] = dateStr.split("-").map(Number);
  const dt = new Date(y, m - 1, d);
  dt.setDate(dt.getDate() + delta);
  return todayStr(dt);
};

const dateLabel = (dateStr) => {
  const today = todayStr();
  const yesterday = addDays(today, -1);
  if (dateStr === today) return "Today";
  if (dateStr === yesterday) return "Yesterday";
  const [y, m, d] = dateStr.split("-").map(Number);
  const dt = new Date(y, m - 1, d);
  return dt.toLocaleDateString(undefined, { weekday: "long", month: "short", day: "numeric" });
};

const weekdayShort = (dateStr) => {
  const [y, m, d] = dateStr.split("-").map(Number);
  const dt = new Date(y, m - 1, d);
  return dt.toLocaleDateString(undefined, { weekday: "short" });
};

const toMinutes = (hhmm) => {
  const [h, m] = hhmm.split(":").map(Number);
  return h * 60 + m;
};

const toHHMM = (mins) => {
  const m = ((mins % 1440) + 1440) % 1440;
  return `${pad2(Math.floor(m / 60))}:${pad2(m % 60)}`;
};

const to12h = (hhmm) => {
  const [h, m] = hhmm.split(":").map(Number);
  const period = h >= 12 ? "PM" : "AM";
  let hour12 = h % 12;
  if (hour12 === 0) hour12 = 12;
  return `${hour12}:${pad2(m)} ${period}`;
};

const uid = () => `${Date.now().toString(36)}${Math.random().toString(36).slice(2, 8)}`;

const dayOfYear = (d = new Date()) => {
  const start = new Date(d.getFullYear(), 0, 0);
  return Math.floor((d - start) / 86400000);
};

function computeStreaks(entries, goal) {
  const byDate = {};
  entries.forEach((e) => { byDate[e.date] = (byDate[e.date] || 0) + e.amount; });
  const dates = Object.keys(byDate).sort();
  let longest = 0, run = 0, prevDate = null;
  dates.forEach((d) => {
    const reached = byDate[d] >= goal;
    if (reached) {
      run = prevDate && addDays(prevDate, 1) === d ? run + 1 : 1;
      longest = Math.max(longest, run);
      prevDate = d;
    } else {
      run = 0; prevDate = null;
    }
  });
  let current = 0;
  let cursor = todayStr();
  if ((byDate[cursor] || 0) < goal) cursor = addDays(cursor, -1);
  while ((byDate[cursor] || 0) >= goal) {
    current += 1;
    cursor = addDays(cursor, -1);
  }
  const anyDayReached = Object.values(byDate).some((v) => v >= goal);
  return { current, longest, byDate, anyDayReached };
}

function generateSchedule(settings) {
  if (!settings.remindersEnabled) return [];
  const start = toMinutes(settings.reminderStart);
  const end = toMinutes(settings.reminderEnd);
  const step = Number(settings.reminderInterval) || 90;
  let times = [];
  for (let t = start; t <= end; t += step) times.push(t);
  if (settings.schoolMode) {
    const sStart = toMinutes(settings.schoolStart);
    const sEnd = toMinutes(settings.schoolEnd);
    const brk = toMinutes(settings.breakTime);
    const lunch = toMinutes(settings.lunchTime);
    times = times.filter((t) => {
      const inSchool = t >= sStart && t <= sEnd;
      if (!inSchool) return true;
      return Math.abs(t - brk) <= 20 || Math.abs(t - lunch) <= 20;
    });
  }
  return times.map(toHHMM);
}

function smartMessage(consumedToday, percent, lastEntryMinsAgo) {
  if (consumedToday === 0) return { tone: "alert", text: "No water logged yet today — consider having a glass now." };
  if (percent >= 100) return { tone: "success", text: "Daily hydration goal completed! Nice work." };
  if (lastEntryMinsAgo != null && lastEntryMinsAgo >= 180) return { tone: "alert", text: "It's been a while since your last entry — time for a refill?" };
  if (percent < 50) return { tone: "info", text: "Good start — keep sipping through the day." };
  return { tone: "info", text: "Keep going! You're making steady progress toward today's goal." };
}

      <path d="M16 3 L16 29 M6.3 21 L25.7 21 M9 12.5 L23 12.5" stroke="white" strokeOpacity="0.32" strokeWidth="0.8" />
    </svg>
  );
}

function ProgressRing({ percent, size = 208, strokeWidth = 14, accent, track, children }) {
  const radius = (size - strokeWidth) / 2;
  const circumference = 2 * Math.PI * radius;
  const offset = circumference - (Math.min(percent, 100) / 100) * circumference;
  const center = size / 2;
  const ticks = Array.from({ length: 24 }, (_, i) => i);
  return (
    <div className="relative" style={{ width: size, height: size }}>
      <svg width={size} height={size} className="absolute inset-0">
        {ticks.map((i) => {
          const angle = (i / ticks.length) * 2 * Math.PI - Math.PI / 2;
          const long = i % 6 === 0;
          const r1 = radius + strokeWidth / 2 + 4;
          const r2 = r1 + (long ? 8 : 4);
          const x1 = center + r1 * Math.cos(angle);
          const y1 = center + r1 * Math.sin(angle);
          const x2 = center + r2 * Math.cos(angle);
          const y2 = center + r2 * Math.sin(angle);
          return <line key={i} x1={x1} y1={y1} x2={x2} y2={y2} stroke={track} strokeWidth={long ? 2 : 1} />;
        })}
      </svg>
      <svg width={size} height={size} className="absolute inset-0 -rotate-90">
        <circle cx={center} cy={center} r={radius} stroke={track} strokeWidth={strokeWidth} fill="none" />
        <circle
          cx={center} cy={center} r={radius} stroke={accent} strokeWidth={strokeWidth} fill="none"
          strokeLinecap="round" strokeDasharray={circumference} strokeDashoffset={offset}
          style={{ transition: "stroke-dashoffset 0.6s ease" }}
        />
      </svg>
      <div className="absolute inset-0 flex items-center justify-center">{children}</div>
    </div>
  );
}

function WeeklyChart({ data, accent, dark }) {
  const max = Math.max(...data.map((d) => d.amount), 1);
  const w = 280, h = 130, gap = 10;
  const barWidth = (w - gap * (data.length - 1)) / data.length;
  return (
    <svg viewBox={`0 0 ${w} ${h + 20}`} width="100%" height={h + 20} preserveAspectRatio="xMidYMid meet">
      {data.map((d, i) => {
        const barH = Math.max(4, (d.amount / max) * h);
        const x = i * (barWidth + gap);
        const y = h - barH;
        return (
          <g key={i}>
            <rect x={x} y={y} width={barWidth} height={barH} rx={6} fill={accent} />
            <text x={x + barWidth / 2} y={h + 14} textAnchor="middle" fontSize="10" fill={dark ? "#94a3b8" : "#64748b"}>{d.day}</text>
          </g>
        );
      })}
    </svg>
  );
}

function AmountPicker({ onPick, ui }) {
  const [custom, setCustom] = useState("");
  const [error, setError] = useState("");
  const submitCustom = () => {
    const n = Number(custom);
    if (!custom || isNaN(n) || n <= 0) { setError("Please enter a valid water amount."); return; }
    if (n > 5000) { setError("That amount seems unrealistic — try a smaller value."); return; }
    onPick(Math.round(n));
    setCustom(""); setError("");
  };
  return (
    <div>
      <div className="grid grid-cols-4 gap-2 mb-3">
        {PRESET_AMOUNTS.map((p) => (
          <button key={p} onClick={() => onPick(p)} className={`rounded-2xl py-3 text-sm font-semibold ${ui.subCard}`}>{p}</button>
        ))}
      </div>
      <div className="flex gap-2">
        <input
          type="number" inputMode="numeric" value={custom}
          onChange={(e) => { setCustom(e.target.value); setError(""); }}
          placeholder="Custom amount (mL)"
          className={`flex-1 rounded-2xl px-4 py-3 text-sm outline-none ${ui.input}`}
        />
        <button onClick={submitCustom} className="rounded-2xl px-4 py-3 bg-cyan-600 text-white text-sm font-semibold">Add</button>
      </div>
      {error && <div className="text-xs text-red-500 mt-1.5">{error}</div>}
    </div>
  );
}

function OnboardingFlow({ ui, dark, onFinish }) {
  const [step, setStep] = useState(0);
  const [name, setName] = useState("");
  const [weight, setWeight] = useState("");
  const [goal, setGoal] = useState(2000);
  const [reminderStart, setReminderStart] = useState("07:00");
  const [reminderEnd, setReminderEnd] = useState("21:00");
  const [interval_, setInterval_] = useState(90);
  const [schoolMode, setSchoolMode] = useState(false);

  const suggestedGoal = weight && !isNaN(Number(weight)) && Number(weight) > 0 ? Math.round(Number(weight) * 30) : null;

  const finish = () => {
    onFinish(
      { name: name.trim() || "Hydration Explorer", weight: weight || "", age: "", wakeTime: "07:00", sleepTime: "22:00" },
      { goal: Number(goal) || 2000, reminderStart, reminderEnd, reminderInterval: Number(interval_), schoolMode }
    );
  };
  const next = () => setStep((s) => Math.min(s + 1, 3));
  const back = () => setStep((s) => Math.max(s - 1, 0));

  return (
    <div className={`min-h-screen ${ui.page} flex flex-col`}>
      <div className="flex justify-center gap-1.5 pt-8 pb-2">
        {[0, 1, 2, 3].map((i) => (
          <div key={i} className={`h-1.5 rounded-full transition-all ${i === step ? "w-6 bg-cyan-600" : "w-1.5 bg-slate-300"}`} />
        ))}
      </div>

      <div className="flex-1 max-w-md w-full mx-auto px-6 flex flex-col justify-center">
        {step === 0 && (
          <div className="text-center">
            <div className="flex justify-center mb-4"><EuclidMark size={64} /></div>
            <h1 className="text-2xl font-extrabold mb-1" style={{ fontFamily: "'Manrope', system-ui, sans-serif" }}>Smart Euclid</h1>
            <p className="text-sm mb-5 text-cyan-600 font-medium">Smart hydration. Better habits.</p>
            <p className={`text-sm mb-6 ${ui.subtext}`}>Track your water intake, personalize your drinking reminders, and build healthier hydration habits.</p>
            <input value={name} onChange={(e) => setName(e.target.value)} placeholder="What should we call you?" className={`w-full rounded-2xl px-4 py-3 text-sm text-center outline-none ${ui.input}`} />
          </div>
        )}

        {step === 1 && (
          <div>
            <h2 className="text-xl font-bold mb-1" style={{ fontFamily: "'Manrope', system-ui, sans-serif" }}>Set your daily goal</h2>
            <p className={`text-sm mb-5 ${ui.subtext}`}>You can change this anytime in Settings.</p>
            <div className="flex items-center justify-center gap-3 mb-4">
              <button onClick={() => setGoal((g) => Math.max(500, g - 250))} className={`h-10 w-10 rounded-full font-bold ${ui.subCard}`}>−</button>
              <div className="text-3xl font-extrabold w-32 text-center">{goal}<span className="text-sm font-medium ml-1">mL</span></div>
              <button onClick={() => setGoal((g) => g + 250)} className={`h-10 w-10 rounded-full font-bold ${ui.subCard}`}>+</button>
            </div>
            <div className={`text-xs mb-1 ${ui.subtext}`}>Optional: enter your weight for a rough estimate</div>
            <input type="number" inputMode="numeric" value={weight} onChange={(e) => setWeight(e.target.value)} placeholder="Weight (kg)" className={`w-full rounded-2xl px-4 py-2.5 text-sm outline-none mb-1.5 ${ui.input}`} />
            {suggestedGoal && (
              <button onClick={() => setGoal(suggestedGoal)} className="text-xs text-cyan-600 font-semibold">
                Use estimate: {suggestedGoal} mL <span className="font-normal">(a rough estimate, not medical advice)</span>
              </button>
            )}
          </div>
        )}

        {step === 2 && (
          <div>
            <h2 className="text-xl font-bold mb-1" style={{ fontFamily: "'Manrope', system-ui, sans-serif" }}>Customize your reminders</h2>
            <p className={`text-sm mb-5 ${ui.subtext}`}>When should Smart Euclid nudge you to drink?</p>
            <div className="grid grid-cols-2 gap-3 mb-1">
              <Field label="Start" ui={ui}><TextInput type="time" value={reminderStart} onChange={setReminderStart} ui={ui} /></Field>
              <Field label="End" ui={ui}><TextInput type="time" value={reminderEnd} onChange={setReminderEnd} ui={ui} /></Field>
            </div>
            <Field label="Remind me every" ui={ui}>
              <select value={interval_} onChange={(e) => setInterval_(e.target.value)} className={`w-full rounded-2xl px-4 py-2.5 text-sm outline-none ${ui.input}`}>
                <option value={60}>60 minutes</option>
                <option value={90}>90 minutes</option>
                <option value={120}>2 hours</option>
              </select>
            </Field>
            <div className={`flex items-center justify-between rounded-2xl px-4 py-3 ${ui.subCard}`}>
              <div className="flex items-center gap-2 text-sm font-medium"><Icon name="graduationCap" size={16} /> School Mode</div>
              <Toggle checked={schoolMode} onChange={setSchoolMode} dark={dark} />
            </div>
          </div>
        )}

        {step === 3 && (
          <div className="text-center">
            <div className="flex justify-center mb-4"><Icon name="flame" size={48} className="text-amber-500" /></div>
            <h2 className="text-xl font-bold mb-1" style={{ fontFamily: "'Manrope', system-ui, sans-serif" }}>Build your hydration streak</h2>
            <p className={`text-sm mb-2 ${ui.subtext}`}>Reach your goal each day to grow your streak and unlock achievements.</p>
            <p className={`text-xs ${ui.subtext}`}>You're all set, {name.trim() || "friend"}. Let's go.</p>
          </div>
        )}
      </div>

      <div className="max-w-md w-full mx-auto px-6 pb-8 pt-4 flex items-center gap-3">
        {step > 0 && <button onClick={back} className={`px-4 py-3 rounded-2xl text-sm font-semibold ${ui.subCard}`}>Back</button>}
        {step < 3 ? (
          <button onClick={next} className="flex-1 py-3 rounded-2xl text-sm font-semibold bg-cyan-600 text-white">{step === 0 ? "Get Started" : "Continue"}</button>
        ) : (
          <button onClick={finish} className="flex-1 py-3 rounded-2xl text-sm font-semibold bg-cyan-600 text-white">Start using Smart Euclid</button>
        )}
        {step > 0 && step < 3 && <button onClick={finish} className={`text-xs font-medium ${ui.subtext}`}>Skip</button>}
      </div>
    </div>
  );
}

/* ---------------------------------------- app ---------------------------------------- */

function App() {
  const [loaded, setLoaded] = useState(false);
  const [profile, setProfile] = useState(null);
  const [settings, setSettings] = useState(DEFAULT_SETTINGS);
  const [entries, setEntries] = useState([]);
  const [showOnboarding, setShowOnboarding] = useState(false);
  const [tab, setTab] = useState("home");

  const [showAdd, setShowAdd] = useState(false);
  const [showEdit, setShowEdit] = useState(null);
  const [editAmount, setEditAmount] = useState("");
  const [editNote, setEditNote] = useState("");
  const [deleteTarget, setDeleteTarget] = useState(null);
  const [showDetect, setShowDetect] = useState(false);
  const [showPrivacy, setShowPrivacy] = useState(false);
  const [showResetConfirm, setShowResetConfirm] = useState(false);
  const [notifPermission, setNotifPermission] = useState(
    typeof Notification !== "undefined" ? Notification.permission : "unsupported"
  );

  const firedRef = useRef(new Set());

  useEffect(() => {
    const p = storageGet("euclid_profile");
    const s = storageGet("euclid_settings");
    const e = storageGet("euclid_entries");
    setProfile(p !== undefined ? p : null);
    setSettings({ ...DEFAULT_SETTINGS, ...(s || {}) });
    setEntries(Array.isArray(e) ? e : []);
    setShowOnboarding(!p);
    setLoaded(true);
  }, []);

  useEffect(() => { if (!loaded) return; const h = setTimeout(() => storageSet("euclid_profile", profile), 300); return () => clearTimeout(h); }, [profile, loaded]);
  useEffect(() => { if (!loaded) return; const h = setTimeout(() => storageSet("euclid_settings", settings), 300); return () => clearTimeout(h); }, [settings, loaded]);
  useEffect(() => { if (!loaded) return; const h = setTimeout(() => storageSet("euclid_entries", entries), 300); return () => clearTimeout(h); }, [entries, loaded]);

  const isDark = settings.theme === "dark";
  const ui = {
    page: isDark ? "bg-slate-950 text-slate-100" : "bg-sky-50 text-slate-800",
    card: isDark ? "bg-slate-900 border border-slate-800" : "bg-white border border-slate-100",
    subCard: isDark ? "bg-slate-800" : "bg-sky-50",
    subtext: isDark ? "text-slate-400" : "text-slate-500",
    divider: isDark ? "border-slate-800" : "border-slate-100",
    nav: isDark ? "bg-slate-900 border-slate-800" : "bg-white border-slate-200",
    input: isDark ? "bg-slate-800 border border-slate-700 text-slate-100 placeholder-slate-500" : "bg-slate-50 border border-slate-200 text-slate-800 placeholder-slate-400",
  };
  const ringAccent = isDark ? "#22d3ee" : "#0891b2";
  const ringTrack = isDark ? "#1e293b" : "#e0f2fe";

  const todayKey = todayStr();
  const todaysEntries = useMemo(
    () => entries.filter((e) => e.date === todayKey).sort((a, b) => a.time.localeCompare(b.time)),
    [entries, todayKey]
  );
  const consumedToday = useMemo(() => todaysEntries.reduce((s, e) => s + e.amount, 0), [todaysEntries]);
  const goal = settings.goal || 2000;
  const remaining = Math.max(goal - consumedToday, 0);
  const percent = goal > 0 ? Math.min(100, Math.round((consumedToday / goal) * 100)) : 0;
  const overGoal = consumedToday > goal ? consumedToday - goal : 0;
  const streaks = useMemo(() => computeStreaks(entries, goal), [entries, goal]);

  const lastEntryMinsAgo = useMemo(() => {
    if (todaysEntries.length === 0) return null;
    const last = todaysEntries[todaysEntries.length - 1];
    const now = new Date();
    return now.getHours() * 60 + now.getMinutes() - toMinutes(last.time);
  }, [todaysEntries]);

  const message = smartMessage(consumedToday, percent, lastEntryMinsAgo);
  const schedule = useMemo(() => generateSchedule(settings), [settings]);
  const nextReminder = useMemo(() => {
    if (!settings.remindersEnabled || schedule.length === 0) return null;
    const now = new Date();
    const hhmm = `${pad2(now.getHours())}:${pad2(now.getMinutes())}`;
    return schedule.find((t) => t > hhmm) || null;
  }, [schedule, settings.remindersEnabled]);

  const weeklyData = useMemo(() => {
    const days = [];
    for (let i = 6; i >= 0; i--) {
      const ds = addDays(todayKey, -i);
      const total = entries.filter((e) => e.date === ds).reduce((s, e) => s + e.amount, 0);
      days.push({ day: weekdayShort(ds), amount: total });
    }
    return days;
  }, [entries, todayKey]);

  const avgDaily = useMemo(() => Math.round(weeklyData.reduce((s, d) => s + d.amount, 0) / 7), [weeklyData]);
  const goalCompletionRate = useMemo(() => {
    const daysReached = weeklyData.filter((d) => d.amount >= goal).length;
    return Math.round((daysReached / 7) * 100);
  }, [weeklyData, goal]);

  const groupedHistory = useMemo(() => {
    const byDate = {};
    entries.forEach((e) => { (byDate[e.date] = byDate[e.date] || []).push(e); });
    return Object.keys(byDate).sort((a, b) => b.localeCompare(a)).map((date) => ({
      date,
      total: byDate[date].reduce((s, e) => s + e.amount, 0),
      items: byDate[date].slice().sort((a, b) => b.time.localeCompare(a.time)),
    }));
  }, [entries]);

  const achievementCtx = { totalEntries: entries.length, anyDayReached: streaks.anyDayReached, longest: streaks.longest };

  useEffect(() => {
    if (!settings.remindersEnabled || !settings.notificationsEnabled) return;
    const id = setInterval(() => {
      const now = new Date();
      const hhmm = `${pad2(now.getHours())}:${pad2(now.getMinutes())}`;
      if (schedule.includes(hhmm)) {
        const key = `${todayStr()}-${hhmm}`;
        if (!firedRef.current.has(key)) {
          firedRef.current.add(key);
          if (typeof Notification !== "undefined" && Notification.permission === "granted") {
            try { new Notification("Smart Euclid", { body: smartMessage(consumedToday, percent, lastEntryMinsAgo).text }); } catch (e) {}
          }
        }
      }
    }, 15000);
    return () => clearInterval(id);
  }, [schedule, settings.remindersEnabled, settings.notificationsEnabled, consumedToday, percent, lastEntryMinsAgo]);

  const addEntry = (amount, note = "") => {
    const n = Math.round(Number(amount));
    if (!n || n <= 0 || n > 5000) return;
    const now = new Date();
    const entry = { id: uid(), date: todayStr(), time: `${pad2(now.getHours())}:${pad2(now.getMinutes())}`, amount: n, note };
    setEntries((prev) => [...prev, entry]);
  };
  const updateEntry = (id, amount, note) => setEntries((prev) => prev.map((e) => (e.id === id ? { ...e, amount, note } : e)));
  const deleteEntry = (id) => setEntries((prev) => prev.filter((e) => e.id !== id));

  const finishOnboarding = (draftProfile, draftSettings) => {
    setProfile(draftProfile);
    setSettings((prev) => ({ ...prev, ...draftSettings }));
    setShowOnboarding(false);
  };

  const exportData = () => {
    const payload = { profile, settings, entries, exportedAt: new Date().toISOString() };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "smart-euclid-data.json"; a.click();
    URL.revokeObjectURL(url);
  };

  const resetAllData = () => {
    setEntries([]);
    setSettings(DEFAULT_SETTINGS);
    setProfile(null);
    setShowOnboarding(true);
    setShowResetConfirm(false);
    storageSet("euclid_profile", null);
    storageSet("euclid_settings", DEFAULT_SETTINGS);
    storageSet("euclid_entries", []);
  };

  if (!loaded) {
    return (
      <div className="min-h-screen flex items-center justify-center bg-sky-50">
        <EuclidMark size={40} />
      </div>
    );
  }

  if (showOnboarding) {
    return <OnboardingFlow ui={ui} dark={isDark} onFinish={finishOnboarding} />;
  }

  return (
    <div className={`min-h-screen pb-28 ${ui.page}`}>
      <TopBar
        title="Smart Euclid"
        subtitle={tab === "home" ? (profile && profile.name ? `Hi, ${profile.name}` : TAB_TITLES.home) : TAB_TITLES[tab]}
      />

      <div className="max-w-md mx-auto px-5">
        {tab === "home" && (
          <div className="space-y-4">
            <Card ui={ui} className="flex flex-col items-center pt-6">
              <div className="relative">
                <ProgressRing percent={percent} accent={ringAccent} track={ringTrack}>
                  <div className="text-center">
                    <div className="text-3xl font-extrabold" style={{ fontFamily: "'Manrope', system-ui, sans-serif" }}>{consumedToday}</div>
                    <div className={`text-xs ${ui.subtext}`}>of {goal} mL</div>
                    <div className="text-cyan-600 text-sm font-bold mt-1">{percent}%</div>
                  </div>
                </ProgressRing>
                {streaks.current > 0 && (
                  <div className="absolute -top-1 -right-1 bg-amber-500 text-white text-[11px] font-bold rounded-full h-9 w-9 flex flex-col items-center justify-center shadow gap-0">
                    <Icon name="flame" size={12} />
                    {streaks.current}
                  </div>
                )}
              </div>
              {overGoal > 0 && <div className="text-xs text-cyan-600 font-semibold mt-2">Goal completed · +{overGoal} mL above goal</div>}
              <div className="grid grid-cols-3 gap-2 w-full mt-5">
                <StatPill label="Remaining" value={`${remaining} mL`} ui={ui} />
                <StatPill label="Streak" value={`${streaks.current}d`} ui={ui} />
                <StatPill label="Next" value={nextReminder ? to12h(nextReminder) : "—"} ui={ui} />
              </div>
            </Card>

            <Card ui={ui} className="flex items-start gap-3">
              <div className={`h-8 w-8 rounded-full flex items-center justify-center flex-shrink-0 ${ui.subCard}`}>
                {message.tone === "success" ? <Icon name="check" size={15} className="text-emerald-500" /> : message.tone === "alert" ? <Icon name="alertCircle" size={15} className="text-amber-500" /> : <Icon name="trendingUp" size={15} className="text-cyan-600" />}
              </div>
              <div className="text-sm pt-1">{message.text}</div>
            </Card>

            <div>
              <div className="text-sm font-semibold mb-2">Quick add</div>
              <div className="grid grid-cols-4 gap-2">
                {QUICK_AMOUNTS.map((a) => (
                  <button key={a} onClick={() => addEntry(a)} className={`rounded-2xl py-3 text-sm font-semibold ${ui.subCard}`}>+{a}</button>
                ))}
                <button onClick={() => setShowAdd(true)} className="rounded-2xl py-3 text-sm font-semibold bg-cyan-600 text-white flex items-center justify-center"><Icon name="plus" size={16} /></button>
              </div>
            </div>

            <Card ui={ui}>
              <div className="flex items-center justify-between mb-1">
                <div className="text-sm font-semibold">Today's log</div>
                <button onClick={() => setTab("history")} className="text-xs text-cyan-600 font-medium flex items-center">See all <Icon name="chevronRight" size={13} /></button>
              </div>
              {todaysEntries.length === 0 ? (
                <div className={`text-sm py-4 text-center ${ui.subtext}`}>Nothing logged yet — add your first drink above.</div>
              ) : (
                todaysEntries.slice(-4).reverse().map((e) => (
                  <EntryRow key={e.id} entry={e} ui={ui}
                    onEdit={(en) => { setShowEdit(en); setEditAmount(String(en.amount)); setEditNote(en.note || ""); }}
                    onDelete={(en) => setDeleteTarget(en)}
                  />
                ))
              )}
            </Card>

            <Card ui={ui} className="flex items-center gap-3">
              <Icon name="sparkles" size={16} className="text-cyan-600 flex-shrink-0" />
              <div className="text-xs">{TIPS[dayOfYear() % TIPS.length]}</div>
            </Card>
          </div>
        )}

        {tab === "history" && (
          <div className="space-y-4 pb-2">
            {groupedHistory.length === 0 && (
              <div className={`text-sm text-center py-10 ${ui.subtext}`}>No entries yet. Log your first drink from Home.</div>
            )}
            {groupedHistory.map((g) => (
              <Card key={g.date} ui={ui}>
                <div className="flex items-center justify-between mb-1">
                  <div className="text-sm font-semibold">{dateLabel(g.date)}</div>
                  <div className={`text-xs ${ui.subtext}`}>{g.total} mL</div>
                </div>
                {g.items.map((e) => (
                  <EntryRow key={e.id} entry={e} ui={ui}
                    onEdit={(en) => { setShowEdit(en); setEditAmount(String(en.amount)); setEditNote(en.note || ""); }}
                    onDelete={(en) => setDeleteTarget(en)}
                  />
                ))}
              </Card>
            ))}
          </div>
        )}

        {tab === "stats" && (
          <div className="space-y-4 pb-2">
            <Card ui={ui}>
              <div className="text-sm font-semibold mb-3">Last 7 days</div>
              <WeeklyChart data={weeklyData} accent={ringAccent} dark={isDark} />
            </Card>

            <div className="grid grid-cols-2 gap-3">
              <StatPill label="Avg daily (7d)" value={`${avgDaily} mL`} ui={ui} />
              <StatPill label="Goal completion" value={`${goalCompletionRate}%`} ui={ui} />
              <StatPill label="Current streak" value={`${streaks.current} days`} ui={ui} />
              <StatPill label="Longest streak" value={`${streaks.longest} days`} ui={ui} />
            </div>

            <Card ui={ui}>
              <div className="text-sm font-semibold mb-3">Achievements</div>
              <div className="grid grid-cols-1 gap-2">
                {ACHIEVEMENTS.map((a) => {
                  const unlocked = a.check(achievementCtx);
                  return (
                    <div key={a.id} className={`flex items-center gap-3 rounded-2xl px-3 py-2.5 ${ui.subCard} ${unlocked ? "" : "opacity-45"}`}>
                      <Icon name="award" size={18} className={unlocked ? "text-amber-500" : ui.subtext} />
                      <div>
                        <div className="text-sm font-semibold">{a.title}</div>
                        <div className={`text-xs ${ui.subtext}`}>{a.desc}</div>
                      </div>
                    </div>
                  );
                })}
              </div>
            </Card>
          </div>
        )}

        {tab === "reminders" && (
          <div className="space-y-4 pb-2">
            <Card ui={ui}>
              <div className="flex items-center justify-between mb-4">
                <div className="text-sm font-semibold">Reminders</div>
                <Toggle checked={settings.remindersEnabled} onChange={(v) => setSettings((s) => ({ ...s, remindersEnabled: v }))} dark={isDark} />
              </div>
              <div className="grid grid-cols-2 gap-3 mb-1">
                <Field label="Start" ui={ui}><TextInput type="time" value={settings.reminderStart} onChange={(v) => setSettings((s) => ({ ...s, reminderStart: v }))} ui={ui} /></Field>
                <Field label="End" ui={ui}><TextInput type="time" value={settings.reminderEnd} onChange={(v) => setSettings((s) => ({ ...s, reminderEnd: v }))} ui={ui} /></Field>
              </div>
              <Field label="Interval" ui={ui}>
                <select value={settings.reminderInterval} onChange={(e) => setSettings((s) => ({ ...s, reminderInterval: Number(e.target.value) }))} className={`w-full rounded-2xl px-4 py-2.5 text-sm outline-none ${ui.input}`}>
                  <option value={60}>Every 60 minutes</option>
                  <option value={90}>Every 90 minutes</option>
                  <option value={120}>Every 2 hours</option>
                </select>
              </Field>
              {typeof Notification !== "undefined" && notifPermission !== "granted" && (
                <button
                  onClick={async () => { try { const p = await Notification.requestPermission(); setNotifPermission(p); } catch (e) { setNotifPermission("denied"); } }}
                  className="w-full mt-1 py-2.5 rounded-2xl text-xs font-semibold bg-cyan-600 text-white"
                >
                  Enable browser notifications while this tab is open
                </button>
              )}
            </Card>

            <Card ui={ui}>
              <div className="flex items-center justify-between mb-3">
                <div className="flex items-center gap-2 text-sm font-semibold"><Icon name="graduationCap" size={16} /> School Mode</div>
                <Toggle checked={settings.schoolMode} onChange={(v) => setSettings((s) => ({ ...s, schoolMode: v }))} dark={isDark} />
              </div>
              {settings.schoolMode && (
                <div className="grid grid-cols-2 gap-3">
                  <Field label="School starts" ui={ui}><TextInput type="time" value={settings.schoolStart} onChange={(v) => setSettings((s) => ({ ...s, schoolStart: v }))} ui={ui} /></Field>
                  <Field label="School ends" ui={ui}><TextInput type="time" value={settings.schoolEnd} onChange={(v) => setSettings((s) => ({ ...s, schoolEnd: v }))} ui={ui} /></Field>
                  <Field label="Break" ui={ui}><TextInput type="time" value={settings.breakTime} onChange={(v) => setSettings((s) => ({ ...s, breakTime: v }))} ui={ui} /></Field>
                  <Field label="Lunch" ui={ui}><TextInput type="time" value={settings.lunchTime} onChange={(v) => setSettings((s) => ({ ...s, lunchTime: v }))} ui={ui} /></Field>
                </div>
              )}
              <p className={`text-xs mt-2 ${ui.subtext}`}>Reminders are held back during class time and prioritized around breaks and lunch.</p>
            </Card>

            <Card ui={ui}>
              <div className="text-sm font-semibold mb-3">Today's schedule preview</div>
              {schedule.length === 0 ? (
                <div className={`text-sm ${ui.subtext}`}>Reminders are off.</div>
              ) : (
                <div className="flex flex-wrap gap-2">
                  {schedule.map((t) => (
                    <span key={t} className={`text-xs font-medium px-3 py-1.5 rounded-full ${t === nextReminder ? "bg-cyan-600 text-white" : ui.subCard}`}>{to12h(t)}</span>
                  ))}
                </div>
              )}
              <p className={`text-xs mt-3 ${ui.subtext}`}>Reminders fire as browser notifications while this app is open in a tab — enable notifications above, and keep the tab open (or installed as an app) during school hours for best results.</p>
            </Card>
          </div>
        )}

        {tab === "settings" && (
          <div className="space-y-4 pb-2">
            <Card ui={ui}>
              <div className="text-sm font-semibold mb-3">Profile</div>
              <Field label="Name" ui={ui}><TextInput value={profile && profile.name || ""} onChange={(v) => setProfile((p) => ({ ...(p || {}), name: v }))} ui={ui} placeholder="Your name" /></Field>
              <div className="grid grid-cols-2 gap-3">
                <Field label="Age (optional)" ui={ui}><TextInput type="number" value={(profile && profile.age) ?? ""} onChange={(v) => setProfile((p) => ({ ...(p || {}), age: v }))} ui={ui} /></Field>
                <Field label="Weight kg (optional)" ui={ui}><TextInput type="number" value={(profile && profile.weight) ?? ""} onChange={(v) => setProfile((p) => ({ ...(p || {}), weight: v }))} ui={ui} /></Field>
              </div>
              <div className="grid grid-cols-2 gap-3">
                <Field label="Wake time" ui={ui}><TextInput type="time" value={(profile && profile.wakeTime) || "07:00"} onChange={(v) => setProfile((p) => ({ ...(p || {}), wakeTime: v }))} ui={ui} /></Field>
                <Field label="Sleep time" ui={ui}><TextInput type="time" value={(profile && profile.sleepTime) || "22:00"} onChange={(v) => setProfile((p) => ({ ...(p || {}), sleepTime: v }))} ui={ui} /></Field>
              </div>
            </Card>

            <Card ui={ui}>
              <div className="text-sm font-semibold mb-2">Daily hydration goal</div>
              <div className="flex items-center justify-center gap-3">
                <button onClick={() => setSettings((s) => ({ ...s, goal: Math.max(500, s.goal - 250) }))} className={`h-10 w-10 rounded-full font-bold ${ui.subCard}`}>−</button>
                <div className="text-2xl font-extrabold w-28 text-center">{settings.goal}<span className="text-sm font-medium ml-1">mL</span></div>
                <button onClick={() => setSettings((s) => ({ ...s, goal: s.goal + 250 }))} className={`h-10 w-10 rounded-full font-bold ${ui.subCard}`}>+</button>
              </div>
            </Card>

            <Card ui={ui} className="space-y-3">
              <div className="flex items-center justify-between">
                <div className="text-sm font-medium">Notifications</div>
                <Toggle checked={settings.notificationsEnabled} onChange={(v) => setSettings((s) => ({ ...s, notificationsEnabled: v }))} dark={isDark} />
              </div>
              <div className="flex items-center justify-between">
                <div className="text-sm font-medium">Dark theme</div>
                <button onClick={() => setSettings((s) => ({ ...s, theme: s.theme === "dark" ? "light" : "dark" }))} className={`h-9 w-9 rounded-full flex items-center justify-center ${ui.subCard}`}>
                  <Icon name={isDark ? "sun" : "moon"} size={16} />
                </button>
              </div>
            </Card>

            <Card ui={ui}>
              <div className="flex items-center justify-between mb-2">
                <div className="flex items-center gap-2 text-sm font-medium"><Icon name="camera" size={16} /> Drinking detection (experimental)</div>
                <Toggle checked={settings.detectionEnabled} onChange={(v) => setSettings((s) => ({ ...s, detectionEnabled: v }))} dark={isDark} />
              </div>
              <p className={`text-xs mb-2 ${ui.subtext}`}>Attempts to notice a drinking-like motion and asks you to confirm — it never assumes an exact amount. This prototype doesn't access your real camera; it simulates the confirmation flow.</p>
              {settings.detectionEnabled && (
                <button onClick={() => setShowDetect("confirm")} className="w-full py-2.5 rounded-2xl text-xs font-semibold bg-cyan-600 text-white">Simulate detection (demo)</button>
              )}
            </Card>

            <Card ui={ui} className="space-y-1">
              <button onClick={() => setShowPrivacy(true)} className="w-full flex items-center justify-between py-1.5 text-sm font-medium">
                <span className="flex items-center gap-2"><Icon name="info" size={16} /> Privacy</span><Icon name="chevronRight" size={15} className={ui.subtext} />
              </button>
              <button onClick={exportData} className="w-full flex items-center justify-between py-1.5 text-sm font-medium">
                <span className="flex items-center gap-2"><Icon name="download" size={16} /> Export my data</span><Icon name="chevronRight" size={15} className={ui.subtext} />
              </button>
              <button onClick={() => setShowResetConfirm(true)} className="w-full flex items-center justify-between py-1.5 text-sm font-medium text-red-500">
                <span className="flex items-center gap-2"><Icon name="trash" size={16} /> Reset all data</span><Icon name="chevronRight" size={15} className="text-red-400" />
              </button>
            </Card>

            <div className={`text-center text-xs pb-4 ${ui.subtext}`}>Smart Euclid · for research evaluation purposes</div>
          </div>
        )}
      </div>

      <BottomNav active={tab} onChange={setTab} ui={ui} dark={isDark} />

      <Modal open={showAdd} onClose={() => setShowAdd(false)} title="Add water" ui={ui}>
        <AmountPicker ui={ui} onPick={(amt) => { addEntry(amt); setShowAdd(false); }} />
      </Modal>

      <Modal open={!!showEdit} onClose={() => setShowEdit(null)} title="Edit entry" ui={ui}>
        {showEdit && (
          <div>
            <Field label="Amount (mL)" ui={ui}><TextInput type="number" value={editAmount} onChange={setEditAmount} ui={ui} /></Field>
            <Field label="Note (optional)" ui={ui}><TextInput value={editNote} onChange={setEditNote} ui={ui} placeholder="e.g. after PE class" /></Field>
            <button
              onClick={() => { const n = Math.round(Number(editAmount)); if (n > 0 && n <= 5000) { updateEntry(showEdit.id, n, editNote); setShowEdit(null); } }}
              className="w-full py-3 rounded-2xl bg-cyan-600 text-white text-sm font-semibold"
            >
              Save changes
            </button>
          </div>
        )}
      </Modal>

      <Modal open={!!deleteTarget} onClose={() => setDeleteTarget(null)} title="Delete entry?" ui={ui}>
        <p className={`text-sm mb-4 ${ui.subtext}`}>This will remove the {deleteTarget && deleteTarget.amount} mL entry at {deleteTarget ? to12h(deleteTarget.time) : ""}.</p>
        <div className="flex gap-2">
          <button onClick={() => setDeleteTarget(null)} className={`flex-1 py-3 rounded-2xl text-sm font-semibold ${ui.subCard}`}>Cancel</button>
          <button onClick={() => { deleteEntry(deleteTarget.id); setDeleteTarget(null); }} className="flex-1 py-3 rounded-2xl text-sm font-semibold bg-red-500 text-white">Delete</button>
        </div>
      </Modal>

      <Modal open={showDetect === "confirm"} onClose={() => setShowDetect(false)} title="Drinking detection (demo)" ui={ui}>
        <div className="text-center py-2">
          <Icon name="camera" size={32} className="mx-auto mb-3 text-cyan-600" />
          <p className="text-sm font-medium mb-1">Possible drinking activity detected.</p>
          <p className={`text-xs mb-5 ${ui.subtext}`}>Did you drink water?</p>
          <div className="flex gap-2">
            <button onClick={() => setShowDetect(false)} className={`flex-1 py-3 rounded-2xl text-sm font-semibold ${ui.subCard}`}>No</button>
            <button onClick={() => setShowDetect("amount")} className="flex-1 py-3 rounded-2xl text-sm font-semibold bg-cyan-600 text-white">Yes, log water</button>
          </div>
        </div>
      </Modal>

      <Modal open={showDetect === "amount"} onClose={() => setShowDetect(false)} title="How much did you drink?" ui={ui}>
        <AmountPicker ui={ui} onPick={(amt) => { addEntry(amt); setShowDetect(false); }} />
      </Modal>

      <Modal open={showPrivacy} onClose={() => setShowPrivacy(false)} title="Privacy" ui={ui}>
        <div className={`text-xs space-y-3 ${ui.subtext}`}>
          <p><span className="font-semibold" style={{ color: isDark ? "#e2e8f0" : "#1e293b" }}>What's collected: </span>your name, optional age/weight, hydration goal, reminder settings, and the water entries you log.</p>
          <p><span className="font-semibold" style={{ color: isDark ? "#e2e8f0" : "#1e293b" }}>Why: </span>to calculate your daily progress, streaks, and reminder schedule.</p>
          <p><span className="font-semibold" style={{ color: isDark ? "#e2e8f0" : "#1e293b" }}>Storage: </span>data is saved in this browser's local storage on your own device only — nothing is sent to a server.</p>
          <p><span className="font-semibold" style={{ color: isDark ? "#e2e8f0" : "#1e293b" }}>Camera data: </span>the drinking-detection demo does not access or store real camera footage.</p>
          <p><span className="font-semibold" style={{ color: isDark ? "#e2e8f0" : "#1e293b" }}>Deleting your data: </span>use Reset All Data in Settings, or clear this site's data in your browser settings.</p>
        </div>
      </Modal>

      <Modal open={showResetConfirm} onClose={() => setShowResetConfirm(false)} title="Reset all data?" ui={ui}>
        <p className={`text-sm mb-4 ${ui.subtext}`}>This permanently deletes your profile, entries, and settings from this browser.</p>
        <div className="flex gap-2">
          <button onClick={() => setShowResetConfirm(false)} className={`flex-1 py-3 rounded-2xl text-sm font-semibold ${ui.subCard}`}>Cancel</button>
          <button onClick={resetAllData} className="flex-1 py-3 rounded-2xl text-sm font-semibold bg-red-500 text-white">Reset</button>
        </div>
      </Modal>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("service-worker.js").catch(() => {});
  });
}
</script>
</body>
</html>
